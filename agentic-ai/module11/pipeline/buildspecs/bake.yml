#
# m11-bake: poll prod's control item until PROMOTED (success) or ROLLED_BACK
# (failure); succeed at once when no rollout was opened (including a BaseAdvanced(noop) deploy).
# After either terminal state run `release prune --stage prod` as m11-prod-deployer and post the
# outcome as a note on the tag commit through the broker. At 2,100 minutes it exits BAKE_TIMEOUT
# (the project timeout is 2,160, the CodeBuild maximum) and the controller carries on.
version: 0.2
env:
  shell: bash
  variables:
    PULUMI_SKIP_UPDATE_CHECK: "1"
phases:
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - for p in harness platform policy partners; do ln -sfn /opt/m11/venv "module11/infrastructure/$p/venv"; done
      - python -m module11 pipeline bake
