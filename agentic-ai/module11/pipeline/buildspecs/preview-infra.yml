#
# m11-preview-infra: started by `preview:deploy-infra` as m11-gitlab-ci-infra
# with a fourth variable PREVIEW_JOB_ID. Before any MR code runs, main's tooling verifies (through
# the broker) that the job belongs to MR PREVIEW_IID at PREVIEW_SHA, is `preview:deploy-infra` and
# running, and that its review-infra deployment was approved by a `platform` member. Only then does
# it run the MR's own tooling, `release deploy --stage mr-<iid> --exclude-ui`, under the boundary and
# the preview backend. No cache (P10), no GitLab or Vercel token.
version: 0.2
env:
  shell: bash
  variables:
    PULUMI_SKIP_UPDATE_CHECK: "1"
phases:
  build:
    commands:
      - |
        echo "$PREVIEW_ACTION" | grep -Eq '^deploy$' && echo "$PREVIEW_IID" | grep -Eq '^[0-9]{1,9}$' \
          && echo "$PREVIEW_SHA" | grep -Eq '^[0-9a-f]{40}$' && echo "$PREVIEW_JOB_ID" | grep -Eq '^[0-9]{1,12}$' \
          || { echo 'PreviewRejected("invalid input")'; exit 1; }
      - |
        python - <<'PY'
        import boto3, hashlib, io, json, os, zipfile
        s3 = boto3.client("s3"); bucket = os.environ["RELEASE_BUCKET"]
        pointer = json.loads(s3.get_object(Bucket=bucket, Key="tooling/main.json")["Body"].read())
        data = s3.get_object(Bucket=bucket, Key=pointer["key"])["Body"].read()
        if hashlib.sha256(data).hexdigest() != pointer["sha256"]:
            raise SystemExit("tooling archive sha256 mismatch")
        zipfile.ZipFile(io.BytesIO(data)).extractall("/tmp/tooling")
        PY
      - cd /tmp/tooling && python -m module11 pipeline preview-infra-verify
      - cd /tmp/mr && for p in harness policy; do ln -sfn /opt/m11/venv "module11/infrastructure/$p/venv"; done
      - cd /tmp/mr && python -m module11 release deploy --stage "mr-$PREVIEW_IID" --exclude-ui --as-caller
