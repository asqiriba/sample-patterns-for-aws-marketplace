# The evaluator set. Changing it is kind `evaluator_set`: it needs a quality
# approval plus a harness-owners or platform approval, bumps `version`, and runs the
# evaluator-set procedure (`module11 evalset rebaseline`), never an ordinary gate.
version: "2"
evaluators:
  - id: Builtin.GoalSuccessRate
    level: session
    kind: builtin
  - id: Builtin.Correctness
    level: trace
    kind: builtin
  - id: Builtin.TrajectoryInOrderMatch
    level: session
    kind: builtin
  - id: Builtin.TrajectoryExactOrderMatch
    level: session
    kind: builtin
  - id: custom.no_credential_leakage
    level: session
    kind: code
    handler: evaluators/no_credential_leakage/handler.py
# Logical ID -> real AgentcoreEvaluator ID per stage, filled from each stack's
# `evaluatorIds` output at deploy time. Builtin IDs map to themselves.
stageIds: {}
# Fingerprint of the service's built-in evaluator definitions, recorded by the evaluator-set
# procedure so a silent judge upgrade is detected as a set change. Null until the first live calibration.
builtinFingerprint: null
