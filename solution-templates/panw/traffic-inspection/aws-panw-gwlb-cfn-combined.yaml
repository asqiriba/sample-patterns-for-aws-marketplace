# ----------------------------------------------------------------------------------------------------------------------
# VPC Route Tables
# ----------------------------------------------------------------------------------------------------------------------

  AttackerPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AttackerVPC
      Tags:
        - Key: Name
          Value: !Sub "${AttackerNamePrefix} Private"

  AttackerPrivateRouteTableAssociationAZ1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref AttackerPrivateRouteTable
      SubnetId: !Ref AttackerSubnetPrivateAZ1

  AttackerPrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AttackerPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref AttackerIGW

  AttackerPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AttackerVPC
      Tags:
        - Key: Name
          Value: !Sub "${AttackerNamePrefix} Public"

  AttackerPublicRouteTableAssociationAZ1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref AttackerPublicRouteTable
      SubnetId: !Ref AttackerSubnetPublicAZ1

  AttackerPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttackerIGWAttachment
    Properties:
      RouteTableId: !Ref AttackerPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref AttackerIGW

# ----------------------------------------------------------------------------------------------------------------------
# Attacker EC2 Instance Resources
# ----------------------------------------------------------------------------------------------------------------------

  # Attacker SG: No open ingress. Frontend EIP is added via separate SecurityGroupIngress
  # resources after EIP allocation for the Log4j callback chain.
  AttackerEC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AttackerNamePrefix}-SG"
      GroupDescription: Security group for Attacker
      VpcId: !Ref AttackerVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic for attack simulation
      Tags:
        - Key: Name
          Value: !Sub "${AttackerNamePrefix} SG"

  # Allow LDAP callback from Frontend EIP for Log4j exploit chain
  AttackerIngressLdapFromFrontend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AttackerEC2SecurityGroup
      IpProtocol: tcp
      FromPort: 1389
      ToPort: 1389
      CidrIp: !Join ['', [!GetAtt FrontendEC2EIP.PublicIp, '/32']]
      Description: Allow LDAP callback from Frontend EIP for Log4j exploit chain

  # Allow exploit payload download from Frontend EIP
  AttackerIngressPayloadFromFrontend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AttackerEC2SecurityGroup
      IpProtocol: tcp
      FromPort: 8888
      ToPort: 8888
      CidrIp: !Join ['', [!GetAtt FrontendEC2EIP.PublicIp, '/32']]
      Description: Allow exploit payload download from Frontend EIP

  AttackerEC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: AttackerIGWAttachment
    Properties:
      ImageId: !Ref LatestAmiId  # Enter the appropriate AMI ID
      InstanceType: t2.micro  # Enter the desired instance type
      IamInstanceProfile: !Ref AttackerSsmInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      NetworkInterfaces:
        - PrivateIpAddress: 192.168.10.10 # Enter the desired private IP address
          SubnetId: !Ref AttackerSubnetPrivateAZ1
          DeviceIndex: 0
          GroupSet:
            - !Ref AttackerEC2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${AttackerNamePrefix} Instance"
      UserData:
        Fn::Base64: !Sub 
          - |
            #!/bin/bash
            # Install Docker (if not already installed)
            sudo yum update -y
            sudo amazon-linux-extras install docker -y
            sudo service docker start
            sudo usermod -aG docker ec2-user  # Add the user to the docker group for non-root access (optional)
            
            EIP_PUBLIC_IP=${EIP_PUBLIC_IP}
            
            # Third-party Docker images provided by Palo Alto Networks for this workshop.
            # Source: Docker Hub migara/ namespace (Palo Alto Networks SE).
            # These images are purpose-built for the VM-Series GWLB workshop and contain
            # intentionally vulnerable applications for security demonstration purposes.
            # Usage approved as part of the Palo Alto Networks / AWS joint workshop program.
            sudo docker pull migara/att-svr
            docker container run -itd --rm --name att-svr -p 8888:8888 -p 1389:1389 -e HOST=${EIP_PUBLIC_IP} -e BEER_STORE_EIP=${FrontendEC2EIP} migara/att-svr
          - 
            # FrontendEIP:
            #   'Fn::ImportValue': 'FrontendEIP'
            EIP_PUBLIC_IP: "$(TOKEN=$(curl -s -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600') && curl -s -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/public-ipv4)"
            

          
